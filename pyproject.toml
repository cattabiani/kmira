[project]
name = "kmira"
version = "0.0.1"
description = "Experiments and codec improvements built on top of mira (https://github.com/mira-wm/mira)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mira",
    "pydantic>=2.11",
    "numpy>=1.24",
    "einops>=0.8",
]

[tool.uv.sources]
mira = { path = "../mira", editable = true }

[project.optional-dependencies]
# Mirrors mira's own extras so kmira gets the same DINOv3/training/eval stack.
train = ["mira[train]"]
eval = ["mira[eval]"]
dev = ["pytest", "ruff", "pyright"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kmira"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = ["slow: builds a real DINOv3 backbone; minutes and gigabytes, not milliseconds"]

[tool.ruff]
line-length = 110

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
venvPath = ".pixi/envs"
venv = "default"

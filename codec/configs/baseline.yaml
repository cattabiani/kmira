# Control arm: mira's stock RAEv2 codec, unmodified, assembled purely from mira's own classes
# (mira.codec.VideoCodec / VideoCodecConfig) via the editable dependency. Never fork this file's
# referenced classes — it exists to prove any variant's delta against untouched ground truth.
#
# Mirrors configs/model/raev2_codec_tdown.yaml in ../mira, with temporal collapsed to 1 frame
# (timesteps=1, temporal_stride=1, patch_size_t=1) so the codec runs as a pure per-frame image
# codec: DINOv3 -> bottleneck -> decoder -> frame. Re-enable temporal_stride=2 / timesteps=40 /
# patch_size_t=2 once the image-only benchmark is working and we want video-level comparisons.

loss:
  _target_: mira.codec.CodecLoss
  _convert_: all

  weights:
    _target_: mira.codec.CodecLossWeights
    loss_mae: 1.0
    loss_lpips_perceptual: 1.0
    lpips_perceptual_frame_frac: 1.0
    loss_dino_latent_consistency: 1.0
    dino_latent_consistency_frame_frac: 1.0
    compile_dino: false
    auto_weight: true

architecture:
  _target_: mira.codec.VideoCodec
  _convert_: all

  config:
    _target_: mira.codec.VideoCodecConfig
    encoder:
      latent_dim: 32
      rae_model: dinov3_vitl16
      aggregation_layers: [11, 13, 15, 17, 19, 21, 23]
      bottleneck:
        stride: 2
        temporal_stride: 1
        noise_tau: 0.0
      compile_dino: false
      video:
        height: 288
        width: 512
        channels: 3
        timesteps: 1
        fps: 20

    decoder:
      latent_dim: ${..encoder.latent_dim}
      activation_checkpointing: false
      bottleneck:
        stride: ${...encoder.bottleneck.stride}
      vit_width: 1152
      vit_depth: 28
      vit_num_heads: 16
      mlp_dim_multiplier: 4
      qk_norm: layernorm
      patch_size: 16
      patch_size_t: 1
      video: ${..encoder.video}

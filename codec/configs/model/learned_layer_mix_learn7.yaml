# EXPERIMENT 2's `learn7` arm: learned aggregation weights over mira's OWN 7 layers only.
#
# Experiment 1 changed two things at once: FREEDOM (the weights became learnable) and REACH (17
# extra, mostly shallower, DINOv3 layers became available). It gained +2.914 dB over its paired
# control at a matched 200,000 steps, with ~92% of the learned mass landing on those 17 layers --
# which points at reach, but does not measure it. This arm varies freedom alone:
#
#   learn7      - control  = the value of freedom
#   learned_mix - learn7   = the value of reach
#
# Identical to model/learned_layer_mix.yaml except for `architecture.expose_layers`, which is the
# whole of the arm: the aggregation reads only the stock 7 blocks, so the shallow layers simply are
# not available to it. Same class, same warm start from checkpoint-304000, same seed schedule, same
# 7-layer consistency loss -- so all three arms stay directly comparable.
#
# Restricting by NOT EXPOSING the other 17 rather than by exposing all 24 and freezing 17 weights at
# zero: the two are bit-identical (a frozen term contributes 0.0 * f, and adding an exact zero is
# exact in IEEE-754), and selection needs no freezing mechanism, so there is nothing to reason about
# regarding gradients or AdamW's decoupled weight decay. It is also cheaper -- 17 fewer tensor
# multiply-adds and ~113MB fewer retained features per forward.
#
# NOTE `expose_layers` sits on `architecture`, NOT on `architecture.config.encoder`. The inner
# `aggregation_layers` below is overridden at construction and is documentation only; the outer one
# is what the encoder reads. See VideoCodecLearnedLayerMix in
# ../../../src/kmira/codec/variants/learned_layer_mix.py for why the two are separate (old
# checkpoints' saved configs record the stock 7 while holding 24 weights).

loss:
  _target_: mira.codec.CodecLoss
  _convert_: all

  weights:
    _target_: mira.codec.CodecLossWeights
    loss_mae: 1.0
    loss_lpips_perceptual: 1.0
    lpips_perceptual_frame_frac: 1.0
    loss_dino_latent_consistency: 1.0
    dino_latent_consistency_frame_frac: 1.0
    compile_dino: ${run.compile}
    auto_weight: true

architecture:
  _target_: kmira.codec.variants.learned_layer_mix.VideoCodecLearnedLayerMix
  _convert_: all

  # THE ARM. Everything else in this file matches model/learned_layer_mix.yaml exactly.
  expose_layers: [11, 13, 15, 17, 19, 21, 23]

  config:
    _target_: mira.codec.VideoCodecConfig
    encoder:
      latent_dim: 32
      rae_model: dinov3_vitl16
      aggregation_layers: [11, 13, 15, 17, 19, 21, 23]
      bottleneck:
        stride: 2
        temporal_stride: 1
        noise_tau: 0.0
      compile_dino: ${run.compile}
      video:
        height: 288
        width: 512
        channels: 3
        timesteps: 1
        fps: 20

    decoder:
      latent_dim: ${..encoder.latent_dim}
      activation_checkpointing: true
      bottleneck:
        stride: ${...encoder.bottleneck.stride}
      vit_width: 768
      vit_depth: 12
      vit_num_heads: 12
      mlp_dim_multiplier: 4
      qk_norm: layernorm
      patch_size: 16
      patch_size_t: 1
      video: ${..encoder.video}
